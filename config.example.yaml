azure_devops:
  organization: "your-org"
  project: "your-project"
  pat_env_var: "ADO_PAT"                # Environment variable holding your ADO Personal Access Token
  category_field: "Custom.Category"     # ADO field reference name for work category
  rework_labels:                        # Tags that QA applies to rework items
    - "rework"
    - "missed-ac"
    - "qa-rejected"

github:
  org: "your-github-org"
  repos:
    - "repo1"
    - "repo2"
  pat_env_var: "GITHUB_PAT"            # Environment variable holding your GitHub PAT
  pr_exclude_patterns:                # Regex patterns to exclude PRs by title (e.g., deploy PRs)
    - "^(production|pentest|master) deploy"
    - "^develop -> master"

sprint:
  stem: "26\\Q1 2026"                   # Parent iteration path levels (above the sprint name)
  name: "Sprint 23.1"                   # Sprint name (leaf level) — can be overridden with --sprint-name
  start_date: "2026-02-23"
  end_date: "2026-03-06"

team_members:
  - name: "Jane Smith"
    github_username: "janesmith"
    ado_identity: "jane.smith@company.com"
  - name: "John Doe"
    github_username: "johndoe"
    ado_identity: "john.doe@company.com"

categories:
  - "strategic"
  - "tech_health"
  - "defects"
  - "operational"
